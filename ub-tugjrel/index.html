<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="usion:leaderboard" content="asc">
<title>УБ Түгжрэл</title>
<style>
:root{--bg:#dcefd0;--panel:#fffdf7;--chip:#eef2f7;--chipd:#d5dce6;--ink:#1e293b;--muted:#64748b;--line:rgba(15,23,42,.08);--scrim:rgba(15,23,42,.45);color-scheme:light}
html.dark{--bg:#10201a;--panel:#1c2533;--chip:#273244;--chipd:#121a26;--ink:#f1f5f9;--muted:#94a3b8;--line:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:3px solid #2f7cf6;outline-offset:2px}
svg{display:block}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "stage" "tools";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{grid-area:hud;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.hl{display:flex;flex-direction:column;align-items:center;gap:5px}
.clock{min-width:78px;padding:6px 10px;border-radius:12px;background:#1e293b;color:#fde047;font:800 19px/1 ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--chipd)}
.dots i.done{background:#22c55e}
.dots i.cur{background:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.35)}
.pills{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.pill{min-width:46px;padding:6px 8px;border-radius:999px;color:#0f172a;font:800 13px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .2s}
.pill.done{transform:scale(1.06);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 2px var(--panel),0 0 0 4px #22c55e}
.rs{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);box-shadow:0 3px 0 var(--chipd);transition:background .15s,transform .1s}
.rs svg{width:24px;height:24px}
.rs:active{transform:translateY(2px);box-shadow:0 1px 0 var(--chipd)}
.rs.armed{background:#dc2626;color:#fff;box-shadow:0 3px 0 #7f1d1d;animation:beat .5s ease-in-out infinite}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.shake{animation:shake .25s}
#toasts{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:10px 16px;border-radius:14px;background:#dc2626;color:#fff;font:900 18px/1 system-ui,sans-serif;box-shadow:0 4px 0 #7f1d1d;animation:pop .3s ease-out}
#tools{grid-area:tools;display:flex;gap:10px;padding:8px 12px 10px;background:var(--panel);border-top:1px solid var(--line)}
.tool{flex:1;min-height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);color:var(--d);box-shadow:0 3px 0 var(--chipd);transition:transform .12s,background .12s,color .12s}
html.dark .tool{color:var(--l)}
.tool svg{width:28px;height:28px}
.tool .cnt{font:800 18px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tool[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 4px 0 var(--d);transform:translateY(-2px)}
.tool:active{transform:translateY(1px)}
.tool.empty .cnt{opacity:.55}
.tool.pulse{animation:pulse .55s ease-in-out 4}
.road{--c:#4f46e5;--d:#3730a3;--l:#a5b4fc}
.bridge{--c:#ea580c;--d:#9a3412;--l:#fdba74}
.erase{--c:#db2777;--d:#9d174d;--l:#f9a8d4}
#end{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--scrim)}
.panel{width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;animation:pop .3s ease-out}
.scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:18px 16px 8px}
.total{font:900 48px/1 ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center}
.rec{width:max-content;margin:10px auto 0;padding:6px 14px;border-radius:999px;background:#f59e0b;color:#1e293b;font-weight:900;animation:pop .4s ease-out}
.best{margin-top:8px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.splits{list-style:none;margin:14px 0 8px;padding:0;display:grid;gap:4px}
.splits li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:var(--line)}
.splits b{font-variant-numeric:tabular-nums}
.save{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;color:var(--muted)}
.save.saved{color:#16a34a}
.save.failed,.save.guest{color:#dc2626}
.btn2{min-height:44px;padding:0 16px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;box-shadow:0 3px 0 #1e3a8a}
.tabs{display:flex;gap:4px;margin-top:6px;padding:4px;border-radius:14px;background:var(--line)}
.tabs button{flex:1;min-height:44px;border-radius:10px;color:var(--muted);font-weight:800}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb{display:grid;gap:4px;margin-top:8px;min-height:120px;align-content:start}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border-radius:12px;background:var(--line);text-align:left}
.row.me{background:rgba(37,99,235,.16);box-shadow:inset 0 0 0 2px #2563eb}
.rk{width:26px;text-align:center;font-weight:900}
.av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#94a3b8;color:#fff;font-weight:900}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;font-variant-numeric:tabular-nums}
.msg{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 8px;color:var(--muted);text-align:center}
.primary{flex:0 0 auto;min-height:58px;margin:8px 16px 16px;border-radius:18px;background:#22c55e;color:#052e16;font:900 20px/1 system-ui,sans-serif;box-shadow:0 5px 0 #15803d;transition:transform .1s}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #15803d}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(234,88,12,.4)}}
@keyframes beat{50%{transform:scale(1.1)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (orientation:landscape){
#app{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hud stage tools"}
#hud{flex-direction:column;justify-content:flex-start;width:112px;padding:10px 8px;border-bottom:0;border-right:1px solid var(--line)}
.pills{flex:0 0 auto}
.rs{margin-top:auto}
#tools{flex-direction:column;justify-content:center;width:96px;padding:10px;border-top:0;border-left:1px solid var(--line)}
.tool{flex:0 0 auto;min-height:76px;flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header id="hud">
<div class="hl">
<div id="clock" class="clock" role="timer">0:00.0</div>
<div id="dots" class="dots" role="img"></div>
</div>
<div id="pills" class="pills" role="group"></div>
<button id="restart" class="rs" type="button" aria-label="Дахин эхлүүлэх"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<div id="stage">
<canvas id="cv" draggable="false"></canvas>
<div id="toasts" aria-live="polite"></div>
</div>
<nav id="tools">
<button id="tool-road" class="tool road" type="button" aria-pressed="true" aria-label="Зам"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3 4 21M16 3l4 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M12 4v3M12 10.5v3M12 17v3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><b class="cnt"></b></button>
<button id="tool-bridge" class="tool bridge" type="button" aria-pressed="false" aria-label="Гүүр"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 8h20M4 8v11M20 8v11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M4 19c0-4.5 3.6-7 8-7s8 2.5 8 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><b class="cnt"></b></button>
<button id="tool-erase" class="tool erase" type="button" aria-pressed="false" aria-label="Арилгах"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.6 4.4 19.6 9.4a1.6 1.6 0 0 1 0 2.2L12.2 19H7.6l-3.2-3.2a1.6 1.6 0 0 1 0-2.2l8-9.2a1.6 1.6 0 0 1 2.2 0Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M8.6 9.6l6 6M12.2 19H20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</nav>
</div>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="endTotal" hidden>
<div class="panel">
<div class="scroll">
<div id="endTotal" class="total"></div>
<div id="endRec" class="rec" hidden></div>
<div id="endBest" class="best"></div>
<ol id="endSplits" class="splits"></ol>
<div id="saveRow" class="save" aria-live="polite"><span id="saveText"></span><button id="retry" class="btn2" type="button" hidden></button></div>
<div class="tabs" role="tablist"><button id="tabF" role="tab" type="button" aria-selected="true" aria-controls="lb"></button><button id="tabG" role="tab" type="button" aria-selected="false" aria-controls="lb"></button></div>
<div id="lb" class="lb" role="tabpanel" aria-live="polite"></div>
</div>
<button id="again" class="primary" type="button"></button>
</div>
</div>
<script src="levels.js"></script>
<script src="sim.js"></script>
<script src="art-places.js"></script>
<script src="art-things.js"></script>
<script src="art-map.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
