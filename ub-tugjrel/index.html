<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="usion:leaderboard" content="asc">
<title>УБ Түгжрэл</title>
<style>
:root{--bg:#dcefd0;--panel:#fffdf7;--chip:#eef2f7;--chipd:#d5dce6;--ink:#1e293b;--muted:#64748b;--line:rgba(15,23,42,.08);--scrim:rgba(15,23,42,.45);--bud:#fef3c7;--budI:#92400e;color-scheme:light}
html.dark{--bg:#10201a;--panel:#1c2533;--chip:#273244;--chipd:#121a26;--ink:#f1f5f9;--muted:#94a3b8;--line:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);--bud:#3a2a0a;--budI:#fcd34d;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:3px solid #2f7cf6;outline-offset:2px}
button:disabled{cursor:default}
svg{display:block}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "stage" "bar";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{grid-area:hud;display:flex;flex-direction:column;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.h1,.h2{display:flex;align-items:center;gap:6px;min-width:0}
.sn{flex:1;min-width:0;font:900 16px/1.15 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{flex:0 0 auto;min-width:68px;padding:8px 10px;border-radius:12px;background:#1e293b;color:#fde047;font:800 19px/1 ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.clock.won{background:#16a34a;color:#fff;box-shadow:inset 0 -3px 0 #14532d}
.fin{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:14px;background:#22c55e;color:#052e16;font:900 16px/1 system-ui,sans-serif;box-shadow:0 4px 0 #15803d;animation:pop .3s ease-out}
.fin:active{transform:translateY(2px);box-shadow:0 2px 0 #15803d}
#hotBtn{font-size:20px}
.jam{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--chip);box-shadow:0 3px 0 var(--chipd)}
.jt{display:flex;align-items:center;justify-content:space-between;gap:6px;font:900 15px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;color:#dc2626}
.jam.ok .jt{color:#16a34a}
.jb{position:relative;height:8px;border-radius:4px;background:var(--line)}
.jb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,#f97316,#dc2626);transition:width .25s}
.jam.ok .jb i{background:#22c55e}
.jb b{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.stat{padding:7px 9px;border-radius:999px;font:800 13px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.bud{flex:0 0 auto;min-width:64px;background:var(--bud);color:var(--budI)}
.bud.low{animation:pulse 1s ease-in-out 2}
.ctl{flex:0 0 auto;display:flex;gap:6px}
.ib{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);font:900 15px/1 system-ui,sans-serif;box-shadow:0 3px 0 var(--chipd);transition:background .15s,transform .1s}
.ib svg{width:20px;height:20px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--chipd)}
#mapBtn{font-size:20px}
#speed[aria-pressed="true"]{background:#f97316;color:#fff;box-shadow:0 3px 0 #9a3412}
#pause[aria-pressed="true"]{background:#2563eb;color:#fff;box-shadow:0 3px 0 #1e3a8a}
#pause .i-play,#pause[aria-pressed="true"] .i-pause{display:none}
#pause[aria-pressed="true"] .i-play{display:block}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:fixed;top:10px;left:8px;right:8px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:100%;padding:9px 14px;border-radius:14px;background:#475569;color:#fff;font:900 16px/1.15 system-ui,sans-serif;text-align:center;box-shadow:0 4px 0 #1e293b;animation:pop .25s ease-out}
.toast.ok{background:#16a34a;box-shadow:0 4px 0 #14532d}
.toast.bad{background:#dc2626;box-shadow:0 4px 0 #7f1d1d}
.banner{position:absolute;left:50%;top:42%;z-index:5;max-width:calc(100% - 24px);transform:translate(-50%,-50%);padding:16px 24px;border-radius:22px;background:#22c55e;color:#fff;font:900 28px/1.1 system-ui,sans-serif;text-align:center;box-shadow:0 6px 0 #15803d,0 18px 40px rgba(0,0,0,.3);pointer-events:none;animation:boom .5s cubic-bezier(.2,1.6,.4,1)}
.hint{position:absolute;left:50%;bottom:14px;z-index:2;max-width:calc(100% - 24px);transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#1e293b;color:#fde047;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card{position:absolute;left:0;top:0;z-index:3;width:min(250px,calc(100% - 16px));padding:10px;border-radius:16px;background:var(--panel);box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 0 1px var(--line)}
.card.in{animation:pop .18s ease-out}
.cn{padding:2px 2px 7px;font:800 15px/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;margin:0 2px 9px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;width:0;height:100%;border-radius:3px;transition:width .25s,background .25s}
.acts{display:grid;gap:7px}
.act{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;text-align:left;box-shadow:0 3px 0 var(--d);transition:transform .1s}
.act b{font-size:13px;white-space:nowrap}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--d)}
.act:disabled{background:var(--chip);color:var(--muted);box-shadow:none}
.a-overpass{--c:#8b5cf6;--d:#5b21b6}
.a-lights{--c:#16a34a;--d:#14532d}
.a-roundabout{--c:#0891b2;--d:#155e75}
.a-widen{--c:#2563eb;--d:#1e3a8a}
.a-road{--c:#16a34a;--d:#14532d}
.a-cancel{--c:var(--chip);--d:var(--chipd);color:var(--ink);justify-content:center}
#bar{grid-area:bar;display:flex;gap:6px;padding:8px 8px 10px;background:var(--panel);border-top:1px solid var(--line)}
#bar{overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-x;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tool{flex:1 0 56px;min-width:56px;min-height:64px;padding:5px 3px 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;background:var(--c);color:#fff;font:800 11px/1.05 system-ui,sans-serif;text-align:center;box-shadow:0 4px 0 var(--d);transition:transform .12s,background .12s,color .12s}
.tool i{font-style:normal;font-size:20px;line-height:1}
.tool span{display:flex;align-items:center;min-height:2.1em}
.tool:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--d)}
.tool:disabled{filter:grayscale(.85);opacity:.5;box-shadow:none}
.tool[aria-pressed="true"]{background:#facc15;color:#1e1b4b;--d:#a16207;transform:translateY(-3px)}
.tool.poor .cost{background:#7f1d1d;color:#fecaca}
.k-overpass{--c:#8b5cf6;--d:#5b21b6}
.k-roundabout{--c:#0891b2;--d:#155e75}
.k-lights{--c:#16a34a;--d:#14532d}
.k-widen{--c:#2563eb;--d:#1e3a8a}
.k-road{--c:#4f46e5;--d:#3730a3}
.k-oddeven{--c:#f97316;--d:#9a3412}
.cost{padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.22);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ovl{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--scrim)}
#list{z-index:20}
.panel{width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;animation:pop .3s ease-out}
.scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:16px 16px 8px}
.head{font:900 24px/1.15 system-ui,sans-serif;text-align:center;color:#16a34a}
.head.fail{color:#dc2626}
.unit{margin-top:4px;text-align:center;color:var(--muted)}
.total{margin-top:8px;font:900 52px/1 ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center}
.stars{margin-top:6px;text-align:center;font-size:30px;letter-spacing:4px}
.stars .off{opacity:.2;filter:grayscale(1)}
.rec{width:max-content;margin:10px auto 0;padding:6px 14px;border-radius:999px;background:#f59e0b;color:#1e293b;font-weight:900;animation:pop .4s ease-out}
.best{margin-top:8px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.facts{list-style:none;margin:14px 0 8px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:var(--line);text-align:center}
.facts span{color:var(--muted);font-size:12px}
.facts b{font-size:17px;font-variant-numeric:tabular-nums}
.save{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;color:var(--muted)}
.save.saved{color:#16a34a}
.save.failed,.save.guest{color:#dc2626}
.btn2{min-height:44px;padding:0 16px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;box-shadow:0 3px 0 #1e3a8a}
.share{display:block;margin:0 auto 6px;background:#db2777;box-shadow:0 3px 0 #9d174d}
.tabs{display:flex;gap:4px;margin-top:6px;padding:4px;border-radius:14px;background:var(--line)}
.tabs button{flex:1;min-width:0;min-height:44px;padding:0 4px;border-radius:10px;color:var(--muted);font-weight:800}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb{display:grid;gap:4px;margin-top:8px;min-height:120px;align-content:start}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border-radius:12px;background:var(--line);text-align:left}
.row.me{background:rgba(37,99,235,.16);box-shadow:inset 0 0 0 2px #2563eb}
.rk{width:26px;text-align:center;font-weight:900}
.av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#94a3b8;color:#fff;font-weight:900}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;font-variant-numeric:tabular-nums}
.msg{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px;color:var(--muted);text-align:center}
.foot{flex:0 0 auto;display:flex;gap:8px;padding:8px 16px 16px}
.big{flex:1 1 0;min-width:0;min-height:58px;padding:0 8px;border-radius:18px;font:900 17px/1.1 system-ui,sans-serif;background:var(--chip);color:var(--ink);box-shadow:0 5px 0 var(--chipd);transition:transform .1s}
.big.primary{background:#22c55e;color:#052e16;box-shadow:0 5px 0 #15803d}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--chipd)}
.big.primary:active:not(:disabled){box-shadow:0 2px 0 #15803d}
.big:disabled{opacity:.45;box-shadow:none}
.big.sq{flex:0 0 58px;font-size:24px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 4px 18px;font:900 20px/1.2 system-ui,sans-serif}
.spots{display:grid;gap:8px;align-content:start;padding-top:8px;padding-bottom:16px}
.spot{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 12px;border-radius:16px;background:var(--line);text-align:left}
.spot.cur{box-shadow:inset 0 0 0 3px #4f46e5}
.spot:disabled{opacity:.55}
.num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#4f46e5;color:#fff;font-weight:900}
.spot.done .num{background:#16a34a}
.si{flex:1;min-width:0}
.si b,.si small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si b{font-size:15px}
.si small{margin-top:3px;color:var(--muted);font-size:12px}
.sr{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sr .st{font-size:13px;letter-spacing:1px}
.sr .st .off{opacity:.2;filter:grayscale(1)}
.sr b{font-variant-numeric:tabular-nums}
.lock{font-size:20px}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (max-width:359px){.clock{min-width:60px;font-size:17px}.jt{font-size:13px}.bud{min-width:56px;padding:6px 7px}}
@media (orientation:landscape){
#app{grid-template-rows:minmax(0,1fr);grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hud stage bar"}
#hud{width:156px;padding:8px;border-bottom:0;border-right:1px solid var(--line);overflow:auto}
.h1{flex-wrap:wrap}
.h1 .clock{order:2;flex:1 0 100%}
.h1 .sn{order:3;flex:1 0 100%;white-space:normal;font-size:14px}
.h1 .fin{order:4;flex:1 0 100%}
.h2{flex:1;flex-direction:column;align-items:stretch}
.jam{flex:0 0 auto}
.ctl{margin-top:auto;justify-content:center}
#bar{flex-direction:column;width:88px;padding:8px 8px 10px;border-top:0;border-left:1px solid var(--line);overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
.tool{flex:0 0 auto;min-height:66px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header id="hud">
<div class="h1">
<button id="mapBtn" class="ib" type="button" data-ta="spots">🗺</button>
<button id="hotBtn" class="ib" type="button" data-ta="hot">🔥</button>
<div id="spotName" class="sn"></div>
<div id="clock" class="clock" role="timer">0:00</div>
<button id="finishBtn" class="fin" type="button" data-t="finish" hidden></button>
</div>
<div class="h2">
<div id="jam" class="jam" role="img">
<div class="jt"><span id="jamTxt"></span></div>
<div class="jb"><i id="jamFill"></i><b id="jamGoal"></b></div>
</div>
<span id="bud" class="stat bud" role="img"></span>
<div class="ctl">
<button id="speed" class="ib" type="button" aria-pressed="false">1×</button>
<button id="pause" class="ib" type="button" aria-pressed="false"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
</div>
</div>
</header>
<div id="stage">
<canvas id="cv" draggable="false"></canvas>
<div id="hint" class="hint" aria-live="polite" hidden></div>
<div id="banner" class="banner" aria-live="assertive" hidden></div>
<div id="card" class="card" role="dialog" aria-labelledby="cardName" hidden>
<div id="cardName" class="cn"></div>
<div id="meter" class="meter"><i id="meterFill"></i></div>
<div id="cardActs" class="acts"></div>
</div>
</div>
<nav id="bar">
<button id="tool-overpass" class="tool k-overpass" type="button" aria-pressed="false"><i aria-hidden="true">🌉</i><span data-t="overpass"></span><b class="cost"></b></button>
<button id="tool-roundabout" class="tool k-roundabout" type="button" aria-pressed="false"><i aria-hidden="true">⭕</i><span data-t="roundabout"></span><b class="cost"></b></button>
<button id="tool-lights" class="tool k-lights" type="button" aria-pressed="false"><i aria-hidden="true">🚦</i><span data-t="lights"></span><b class="cost"></b></button>
<button id="tool-widen" class="tool k-widen" type="button" aria-pressed="false"><i aria-hidden="true">↔️</i><span data-t="widen"></span><b class="cost"></b></button>
<button id="tool-road" class="tool k-road" type="button" aria-pressed="false"><i aria-hidden="true">🛣️</i><span data-t="road"></span><b class="cost"></b></button>
<button id="tool-oddeven" class="tool k-oddeven" type="button"><i aria-hidden="true">🔢</i><span data-t="oddeven"></span><b class="cost"></b></button>
</nav>
</div>
<div id="end" class="ovl" role="dialog" aria-modal="true" aria-labelledby="endHead" hidden>
<div class="panel">
<div class="scroll">
<div id="endHead" class="head"></div>
<div id="endSpot" class="unit"></div>
<div id="endTotal" class="total"></div>
<div id="endStars" class="stars" role="img"></div>
<div id="endRec" class="rec" data-t="newBest" hidden></div>
<div id="endBest" class="best"></div>
<ul class="facts">
<li><span data-t="fixes"></span><b id="fFix"></b></li>
<li><span data-t="spent"></span><b id="fSpent"></b></li>
<li><span data-t="oddeven"></span><b id="fOdd"></b></li>
</ul>
<div id="saveRow" class="save" aria-live="polite"><span id="saveText"></span><button id="retry" class="btn2" type="button" data-t="retry" hidden></button></div>
<button id="shareBtn" class="btn2 share" type="button" data-t="share" hidden></button>
<div class="tabs" role="tablist"><button id="tabS" role="tab" type="button" aria-selected="true" aria-controls="lb" data-t="thisSpot"></button><button id="tabF" role="tab" type="button" aria-selected="false" aria-controls="lb" data-t="friends"></button><button id="tabG" role="tab" type="button" aria-selected="false" aria-controls="lb" data-t="global"></button></div>
<div id="lb" class="lb" role="tabpanel" aria-live="polite"></div>
</div>
<div class="foot">
<button id="again" class="big" type="button" data-t="again"></button>
<button id="nextBtn" class="big" type="button" data-t="next"></button>
<button id="endMap" class="big sq" type="button" data-ta="spots">🗺</button>
</div>
</div>
</div>
<div id="list" class="ovl" role="dialog" aria-modal="true" aria-labelledby="listTitle" hidden>
<div class="panel">
<div class="lh"><span id="listTitle" data-t="spots"></span><button id="listX" class="ib" type="button" data-ta="close">✕</button></div>
<div id="spots" class="scroll spots"></div>
</div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="map-data.js"></script>
<script src="scenario.js"></script>
<script src="sim.js"></script>
<script src="art-places.js"></script>
<script src="art-things.js"></script>
<script src="art-map.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
