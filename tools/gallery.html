<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f6}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../ub-tugjrel/levels.js"></script>
<script src="../ub-tugjrel/art-places.js"></script>
<script src="../ub-tugjrel/art-things.js"></script>
<script>
const c = document.getElementById('c'), ts = 48, W = 900, H = 760;
c.width = W * 2; c.height = H * 2; c.style.width = W + 'px'; c.style.height = H + 'px';
const g = c.getContext('2d'); g.scale(2, 2);
g.fillStyle = '#eef2f6'; g.fillRect(0, 0, W, H);
window.errs = [];
const now = 1500;
function safe(f) { try { f(); } catch (e) { window.errs.push(String(e && e.stack || e)); } }
const P = window.UBArtPlaces, T = window.UBArtThings;
const places = [['palace', 5, 1], ['skytower', 1, 2], ['flats', 2, 1], ['flats', 1, 1], ['memorial', 3, 2], ['hill', 3, 1], ['market', 2, 2], ['ger', 2, 1], ['ger', 1, 1], ['pines', 2, 1], ['generic', 1, 1]];
let x = 20, y = 60;
for (const [k, w, h] of places) {
  if (x + w * ts > W - 20) { x = 20; y += 3 * ts; }
  g.strokeStyle = 'rgba(0,0,0,.15)'; g.strokeRect(x, y, w * ts, h * ts);
  if (P) safe(() => P.draw(g, k, x, y, w * ts, h * ts, ts, now, x + y));
  g.fillStyle = '#333'; g.font = '11px sans-serif'; g.fillText(k, x, y + h * ts + 12);
  x += w * ts + 30;
}
y = 520; x = 20;
const cols = UBLevels.COLORS;
if (T) {
  ['flats', 'ger'].forEach((a, i) => safe(() => T.source(g, a, cols[i], x + i * 70, y, ts, now, 3, i)));
  ['work', 'school', 'market', 'hospital', 'palace', 'store'].forEach((k, i) => safe(() => T.destination(g, k, cols[i % 4], x + 160 + i * 64, y, ts, now)));
  [0, Math.PI / 2, Math.PI, -Math.PI / 2].forEach((a, i) => safe(() => T.car(g, 60 + i * 50, 640, a, ts, cols[i], i)));
  safe(() => T.bus(g, 300, 640, 0, ts, 1));
  safe(() => T.label(g, 'Төрийн ордон', 450, 640, ts, cols[2]));
  safe(() => T.label(g, '13-р хороолол', 580, 640, ts, cols[0]));
  safe(() => T.bubble(g, 'Хөдөл л дөө!', 700, 700, ts, 1));
  g.fillStyle = '#4b5060'; g.fillRect(20, 700, 400, 28);
  safe(() => T.streetName(g, 'Энхтайваны өргөн чөлөө', 20, 420, 714, ts));
}
window.done = true;
</script></body></html>
