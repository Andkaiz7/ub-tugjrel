<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script>
const g = document.getElementById('c').getContext('2d');
const CREAM = '#fff8ec';

const sky = g.createLinearGradient(0, 0, 0, 512);
sky.addColorStop(0, '#8a4dff');
sky.addColorStop(1, '#3a137f');
g.fillStyle = sky;
g.fillRect(0, 0, 512, 512);
const glow = g.createRadialGradient(256, 200, 10, 256, 220, 300);
glow.addColorStop(0, 'rgba(255,255,255,0.18)');
glow.addColorStop(1, 'rgba(255,255,255,0)');
g.fillStyle = glow;
g.fillRect(0, 0, 512, 512);

g.save();
g.translate(256, 150);
g.scale(0.62, 0.62);
g.fillStyle = '#ffc93c';
for (const [hx, hy] of [[-70, 70], [70, 40]]) {
  g.beginPath();
  g.ellipse(hx, hy, 46, 34, -0.38, 0, Math.PI * 2);
  g.fill();
}
g.fillRect(-46, -110, 24, 180);
g.fillRect(94, -140, 24, 180);
g.beginPath();
g.moveTo(-46, -110);
g.lineTo(118, -140);
g.lineTo(118, -88);
g.lineTo(-46, -58);
g.closePath();
g.fill();
g.restore();

function pill(x, y, w, h) {
  g.fillStyle = CREAM;
  g.beginPath();
  g.roundRect(x, y, w, h, h / 2);
  g.fill();
}
pill(80, 250, 200, 60);
pill(304, 250, 128, 60);
pill(80, 340, 120, 60);

const x = 224, y = 326, w = 208, h = 88, r = 26;
g.fillStyle = 'rgba(20,4,50,0.35)';
g.beginPath(); g.roundRect(x, y + 20, w, h, r); g.fill();
g.fillStyle = '#c46f06';
g.beginPath(); g.roundRect(x, y + 12, w, h, r); g.fill();
const face = g.createLinearGradient(0, y, 0, y + h);
face.addColorStop(0, '#ffe58a');
face.addColorStop(0.5, '#ffc93c');
face.addColorStop(1, '#f39f17');
g.fillStyle = face;
g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
g.fillStyle = 'rgba(255,255,255,0.45)';
g.beginPath(); g.roundRect(x + 14, y + 9, w - 28, 12, 6); g.fill();
g.fillStyle = '#3b1a06';
g.font = '900 76px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
g.textAlign = 'center';
g.textBaseline = 'middle';
g.fillText('?', x + w / 2, y + h / 2 + 3);

window.done = true;
</script></body></html>
