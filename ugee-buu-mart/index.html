<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="usion:leaderboard" content="desc">
<meta name="theme-color" content="#1c0843">
<title>Үгээ бүү март</title>
<style>
:root{--font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#fff8ec;--mut:rgba(236,226,255,.66);--dim:rgba(236,226,255,.4);--g1:#fff4c9;--g2:#ffd257;--g3:#f39f17;--gE:#9b5806;--gT:#3a1c00;--heart:#ff4d6d;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.13);color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);font:600 16px/1.25 var(--font)}
body{background:radial-gradient(75% 42% at 50% -8%,rgba(255,206,128,.34),rgba(255,206,128,0) 72%),radial-gradient(110% 38% at 50% 112%,rgba(255,64,156,.32),rgba(255,64,156,0) 70%),linear-gradient(180deg,#2d0b5e 0%,#1b0743 52%,#0b0221 100%) #1b0743}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #8fd6ff;outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip}
.lights{position:absolute;inset:0;overflow:hidden;overflow:clip;pointer-events:none}
.beam{position:absolute;top:-6%;width:62vmax;height:120%;pointer-events:none;background:linear-gradient(180deg,rgba(255,236,190,.2),rgba(255,236,190,.05) 55%,rgba(255,236,190,0) 85%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sway 9s ease-in-out infinite alternate}
.beam.l{left:-31vmax;transform:rotate(-24deg)}
.beam.r{right:-31vmax;transform:rotate(24deg);animation-delay:-4.5s;animation-name:swayR}
@keyframes sway{from{transform:rotate(-30deg)}to{transform:rotate(-16deg)}}
@keyframes swayR{from{transform:rotate(30deg)}to{transform:rotate(16deg)}}
section[data-screen]{position:absolute;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#round{display:flex;flex-direction:column}
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
#chip{flex:0 1 auto;min-width:0;max-width:48%;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px 0 5px;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px var(--line),0 6px 16px rgba(0,0,0,.25);transition:transform .12s ease-out}
#chip:active{transform:scale(.96)}
#chip:disabled .caret{display:none}
#chipName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:16px}
#chip .av{width:36px;height:36px;font-size:15px}
.caret{flex:none;width:12px;height:12px;opacity:.75}
#qn{flex:1;min-width:34px;text-align:center;font-weight:800;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.hearts{flex:none;display:flex;gap:1px}
.hearts i{display:block;width:22px;height:22px;color:var(--heart);filter:drop-shadow(0 0 6px rgba(255,77,109,.55));transition:transform .3s ease-out,opacity .3s ease-out}
.hearts svg{width:100%;height:100%}
.hearts i.off{opacity:.22;transform:scale(.78);filter:none;color:#d9cfee}
.hearts i.lose{animation:lose .55s ease-out}
@keyframes lose{0%{transform:scale(1.5)}35%{transform:scale(1.2) rotate(-14deg)}70%{transform:scale(.9) rotate(10deg)}100%{transform:scale(.78)}}
#score{flex:none;min-width:58px;height:36px;padding:0 12px;border-radius:999px;display:grid;place-items:center;background:linear-gradient(180deg,var(--g1),var(--g2) 48%,var(--g3));color:var(--gT);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--gE),0 6px 18px rgba(255,180,40,.28),inset 0 1px 0 rgba(255,255,255,.8)}
#score.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 14px;overflow-y:auto}
#stage::before{content:"";flex:3 1 0}
#stage::after{content:"";flex:1 1 0}
#card{position:relative;flex:none;width:100%;max-width:540px;margin:4px 0;padding:20px 16px 24px;border-radius:28px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.035));box-shadow:inset 0 0 0 1.5px var(--line),inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.38),0 0 90px rgba(170,96,255,.2)}
#card.in{animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.songRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(46px,1fr);align-items:start;min-height:40px}
.songBox{grid-column:2;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
#song{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;padding:6px 13px 6px 10px;border-radius:999px;background:rgba(255,210,87,.14);color:var(--g2);font-weight:800;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,210,87,.25)}
#song svg{flex:none;width:15px;height:15px}
#songT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#songSrc{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--mut);opacity:.85;white-space:nowrap}
#muteBtn{grid-column:3;justify-self:end;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);transition:transform .1s ease-out,opacity .15s}
#muteBtn:active{transform:scale(.9)}
#muteBtn.off{color:var(--dim);opacity:.7}
#muteBtn svg{width:20px;height:20px}
#lbBtn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--g1);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s ease-out}
#lbBtn:active{transform:scale(.9)}
#lbBtn svg{width:20px;height:20px}
#boardDlg{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(6,0,20,.5);animation:fade .2s ease-out}
#boardDlg .sheet{height:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#muteBtn:not(.off) .muted,#muteBtn.off .unmuted{display:none}
#prev{margin:16px 0 12px;color:var(--mut);font-weight:600;font-size:clamp(15px,4.3vw,19px);line-height:1.35;overflow-wrap:anywhere}
#line{margin:0;color:#fff;font-weight:800;font-size:clamp(21px,6.3vw,29px);line-height:1.5;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.35)}
#line .w{transition:color .3s}
.slot{position:relative;display:inline-block;min-width:2.4em;padding:0 .2em;border-radius:.34em;line-height:1.22;vertical-align:baseline;color:var(--g2);text-align:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,210,87,.3)}
.slot.cur{background:rgba(255,210,87,.14);box-shadow:inset 0 0 0 2px var(--g2)}
.slot.cur::after{content:"";position:absolute;inset:-3px;border-radius:.4em;box-shadow:0 0 0 2px rgba(255,210,87,.7),0 0 18px rgba(255,210,87,.5);animation:glow 1.1s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.25}to{opacity:1}}
.slot.on,.slot.miss{min-width:0;padding:0;background:none;box-shadow:none}
.slot.on{animation:fill .38s cubic-bezier(.2,.9,.3,1.5)}
@keyframes fill{from{transform:scale(1.35) translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.slot.miss{color:#ff9db0;text-decoration:underline 3px rgba(255,77,109,.75);text-underline-offset:.18em;animation:fill .38s ease-out}
#line.win .w,#line.win .slot{color:var(--g1);text-shadow:0 0 18px rgba(255,210,87,.85)}
#line.win{animation:win .5s ease-out}
@keyframes win{40%{transform:scale(1.04)}}
#pop{position:absolute;left:0;right:0;top:-10px;font-weight:900;font-size:34px;color:var(--g2);text-shadow:0 3px 0 var(--gE),0 0 24px rgba(255,210,87,.7);opacity:0;pointer-events:none}
#pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}70%{opacity:1;transform:translateY(-22px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.95)}}
#tray{flex:none;position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:12px 10px;min-height:150px;padding:20px 14px calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-1 * env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(9,1,28,0),rgba(9,1,28,.55) 34%,rgba(9,1,28,.7))}
#tray::before{content:"";position:absolute;left:10%;right:10%;top:4px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,87,.45),transparent)}
.tile{position:relative;min-height:54px;min-width:64px;max-width:100%;padding:10px 18px 9px;border-radius:17px;background:linear-gradient(180deg,#fff5cf 0%,#ffd65e 40%,#f6a51b 100%);color:var(--gT);font-weight:800;font-size:clamp(18px,5.3vw,22px);line-height:1.15;overflow-wrap:anywhere;box-shadow:0 5px 0 #a35e07,0 11px 22px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(170,90,0,.22);transition:transform .09s ease-out,opacity .24s ease-out;animation:tileIn .38s cubic-bezier(.2,.9,.3,1.3) backwards}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #a35e07,0 4px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.8)}
.tile.used{opacity:0;transform:translateY(-26px) scale(.55);pointer-events:none}
.tile.bad{background:linear-gradient(180deg,#ffd6dc 0%,#ff7a8f 45%,#e2354f 100%);color:#4a0012;box-shadow:0 5px 0 #8e1428,0 11px 22px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.6);animation:shake .42s ease-in-out}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (hover:hover){.tile:not(.used):hover{transform:translateY(-2px)}}
.av{position:relative;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.35);background:#6d28d9;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.18)}
.av.pack{border-radius:30%}
img.av{object-fit:cover}
.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}
.av.pack .avimg{border-radius:30%}
#end{overflow-y:auto;overscroll-behavior:contain}
.endIn{max-width:540px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center}
#endHead{margin:4px 0 0;font-weight:900;font-size:28px;color:var(--g1);text-shadow:0 0 24px rgba(255,210,87,.5);animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
#endHead.out{color:#ffc2cd;text-shadow:0 0 24px rgba(255,77,109,.45)}
#endWho{align-self:center;display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 14px 4px 4px;border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1.5px var(--line)}
#endWho .av{width:32px;height:32px;font-size:14px}
#endName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
#endScore{font-weight:900;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--g2);text-shadow:0 4px 0 var(--gE),0 0 40px rgba(255,210,87,.45);animation:cardIn .55s .08s cubic-bezier(.2,.9,.3,1.3) backwards}
#endMeta{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--mut);font-weight:800}
#endMeta .hearts i{width:20px;height:20px}
.save{min-height:24px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--mut)}
.save.saved{color:#7ee2a8}
.save.failed,.save.guest{color:#ffb4c1}
.btn2{min-height:44px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:800;font-size:14px;color:#fff;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s ease-out}
.btn2:active{transform:scale(.95)}
.big{width:100%;min-height:58px;border-radius:19px;background:linear-gradient(180deg,#ff8dbb 0%,#ff3f88 45%,#d81b63 100%);color:#fff;font-weight:900;font-size:21px;letter-spacing:.01em;text-shadow:0 1px 2px rgba(120,0,40,.4);box-shadow:0 6px 0 #8d0d41,0 14px 30px rgba(255,63,136,.35),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .09s ease-out}
.big:active{transform:translateY(4px)}
.board{padding:8px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:rgba(0,0,0,.28)}
.tabs button{min-height:44px;border-radius:12px;font-weight:800;color:var(--mut);transition:transform .1s ease-out}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
#lb{display:flex;flex-direction:column;gap:4px;margin-top:8px;min-height:110px;max-height:264px;overflow-y:auto}
.row{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px 6px 8px;border-radius:14px;text-align:left;transition:transform .1s ease-out}
button.row{background:rgba(255,255,255,.04)}
button.row:active{transform:scale(.98)}
.row.me{background:rgba(255,210,87,.15);box-shadow:inset 0 0 0 1.5px rgba(255,210,87,.5)}
.row .rk{font-weight:900;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .av{width:36px;height:36px;font-size:15px;background:rgba(255,255,255,.16)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.row .sc{font-weight:900;color:var(--g2);font-variant-numeric:tabular-nums}
.msg{min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--mut);font-size:14px;font-weight:700}
#endNext{margin:10px 2px -2px;text-align:left;font-weight:900;font-size:20px}
.qw{position:relative;flex:none}
.qw svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;opacity:.6;pointer-events:none}
.q{width:100%;height:48px;padding:0 14px 0 42px;border:0;border-radius:15px;outline:none;background:rgba(255,255,255,.1);color:#fff;font:600 16px var(--font);box-shadow:inset 0 0 0 1.5px var(--line);-webkit-appearance:none;appearance:none}
.q::placeholder{color:var(--dim)}
.q:focus{box-shadow:inset 0 0 0 2px rgba(255,210,87,.7)}
.q::-webkit-search-cancel-button{-webkit-appearance:none}
.pk h4{margin:16px 4px 10px;text-align:left;font-weight:900;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 4px}
.sg{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:6px 2px;border-radius:16px}
.sg .av{width:62px;height:62px;font-size:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);transition:transform .12s ease-out}
.sg:active .av{transform:scale(.9)}
.sg.cur .av,.sg.on .av{box-shadow:0 0 0 3px #1d0846,0 0 0 6px var(--g2),0 0 22px rgba(255,210,87,.6)}
.sg .ck{display:none;position:absolute;top:2px;right:calc(50% - 33px);width:22px;height:22px;border-radius:50%;place-items:center;background:var(--g2);color:var(--gT);box-shadow:0 0 0 2.5px #1d0846,0 3px 8px rgba(0,0,0,.4);pointer-events:none}
.sg .ck svg{width:13px;height:13px}
.sg.on .ck{display:grid}
.sg .nm.sm{font-size:11px;letter-spacing:-.01em}
.sg .nm{max-width:100%;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink);overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pk .none{padding:28px 0;color:var(--mut);font-weight:700;text-align:center}
#picker{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding-top:calc(48px + env(safe-area-inset-top));background:rgba(6,0,20,.62);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:100%;height:88%;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 0 calc(14px + env(safe-area-inset-left));border-radius:28px 28px 0 0;background:linear-gradient(180deg,#341172 0%,#1d0846 60%);box-shadow:0 -14px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);animation:sheetIn .34s cubic-bezier(.2,.85,.2,1)}
@keyframes sheetIn{from{transform:translateY(100%)}}
.sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 12px 4px}
.sh b{font-weight:900;font-size:21px}
.x{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:transform .1s ease-out}
.x:active{transform:scale(.9)}
.x svg{width:18px;height:18px}
#pkList{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 12px}
#pkFoot{flex:none;display:flex;flex-direction:column;gap:10px;padding:10px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pkRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#pkCountLbl{font-weight:800;font-size:13px;color:var(--mut);white-space:nowrap}
.seg{flex:1;max-width:260px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.32)}
.seg button{min-height:44px;border-radius:11px;font-weight:900;font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;transition:transform .1s ease-out,background .15s,color .15s}
.seg button[aria-checked="true"]{background:var(--g2);color:var(--gT);box-shadow:0 2px 8px rgba(255,210,87,.35)}
.seg button:active{transform:scale(.95)}
#pkGo{min-height:52px;font-size:19px}
#stripRow{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px 0}
#strip{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
#strip::-webkit-scrollbar{display:none}
.pc{position:relative;flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 11px 0 4px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity .3s}
.pc .av{width:28px;height:28px;font-size:12px}
.pc .n{color:var(--mut)}
.pc .s{color:var(--g2)}
.pc.me{box-shadow:inset 0 0 0 2px var(--g2)}
.pc.done{background:rgba(110,231,160,.16)}
.pc.gone{opacity:.4}
.pc.bump .s{display:inline-block;animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
.chatBtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s ease-out}
.chatBtn:active{transform:scale(.9)}
.chatBtn svg{width:22px;height:22px}
#hall,#results{overflow-y:auto;overscroll-behavior:contain}
.hallIn{max-width:540px;min-height:100%;margin:0 auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.hallIn .note{margin-top:auto;padding-top:8px}
#results .endIn{min-height:100%;justify-content:center}
#trophy{align-self:center;width:84px;height:84px;color:var(--g2);filter:drop-shadow(0 6px 0 var(--gE)) drop-shadow(0 0 26px rgba(255,210,87,.55));animation:bump .6s cubic-bezier(.2,.9,.3,1.4)}
.singer{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px 14px 14px;border-radius:26px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1.5px var(--line),inset 0 1px 0 rgba(255,255,255,.18),0 20px 44px rgba(0,0,0,.32),0 0 70px rgba(170,96,255,.2);transition:transform .12s ease-out;animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
.singer:not(:disabled):active{transform:scale(.98)}
.singer .av{width:76px;height:76px;font-size:28px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.35)}
.singer .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.singer b{font-weight:900;font-size:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.singer small{color:var(--g2);font-weight:800;font-size:14px}
.singer .caret{width:16px;height:16px}
.singer:disabled{cursor:default}
.singer:disabled .caret{display:none}
.phead{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--dim);font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.phead b{color:var(--mut);font-variant-numeric:tabular-nums}
.phead .btn2{margin-left:auto;text-transform:none;letter-spacing:0}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px 8px 9px;border-radius:18px;text-align:left;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line);animation:cardIn .35s cubic-bezier(.2,.8,.2,1);transition:transform .1s ease-out}
button.pl:active{transform:scale(.98)}
.pl .av{width:44px;height:44px;font-size:17px}
.pl .nm{min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:rgba(255,210,87,.18);color:var(--g2);font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.tag.dim{background:rgba(255,255,255,.1);color:var(--mut)}
.pl .rd{font-weight:900;font-size:14px;color:var(--dim);white-space:nowrap}
.pl.ok{background:rgba(110,231,160,.1);box-shadow:inset 0 0 0 2px rgba(110,231,160,.6)}
.pl.ok .rd{color:#7ee2a8}
.pl.away{opacity:.55}
.note{margin:0;min-height:18px;text-align:center;color:var(--mut);font-weight:700;font-size:14px}
.big.ready.on{background:linear-gradient(180deg,#9df5c8 0%,#34d08b 45%,#139d5d 100%);color:#04301b;text-shadow:none;box-shadow:0 6px 0 #0a6a3c,0 14px 30px rgba(52,208,139,.3),inset 0 2px 0 rgba(255,255,255,.6)}
.big.gold{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%);color:var(--gT);text-shadow:none;box-shadow:0 6px 0 var(--gE),0 14px 30px rgba(255,180,40,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.big:disabled{filter:saturate(.25) brightness(.62);transform:none;cursor:default}
.link{align-self:center;min-height:44px;padding:0 14px;color:var(--mut);font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:4px}
#endHall{align-self:center}
.rtop{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 52px}
.rtop .chatBtn{position:absolute;right:0;top:0}
#resWho{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 14px 4px 4px;border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1.5px var(--line)}
#resWho .av{width:32px;height:32px;font-size:14px}
#resSinger{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
#resHead{margin:6px 0 2px;font-weight:900;font-size:30px;color:var(--g1);text-shadow:0 0 26px rgba(255,210,87,.55);animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
#resHead.wait{font-size:22px;color:var(--mut);text-shadow:none}
.rr{grid-template-columns:30px 44px minmax(0,1fr) auto}
.pp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:rgba(255,255,255,.1);color:var(--mut)}
.pp.p1{background:linear-gradient(180deg,#fff3c2,#ffc93c);color:#5a3300;box-shadow:0 0 16px rgba(255,201,60,.55)}
.pp.p2{background:linear-gradient(180deg,#f6f8fc,#b6c0d4);color:#2c3445}
.pp.p3{background:linear-gradient(180deg,#ffd9b5,#d6843f);color:#4a2100}
.rr .sc{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.rr .sc b{font-weight:900;font-size:20px;color:var(--g2)}
.rr .sc small{font-weight:800;font-size:12px;color:var(--mut)}
.rr.win{background:rgba(255,210,87,.12);box-shadow:inset 0 0 0 2px var(--g2),0 0 34px rgba(255,210,87,.22)}
.rr.gone{opacity:.6}
#chat{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(6,0,20,.5);animation:fade .2s ease-out}
.csheet{width:100%;max-width:560px;margin:0 auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:linear-gradient(180deg,#341172 0%,#1d0846 70%);box-shadow:0 -14px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);animation:sheetIn .3s cubic-bezier(.2,.85,.2,1)}
#phrases{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph{min-height:44px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:800;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s ease-out}
.ph:active{transform:scale(.95)}
.cform{display:flex;gap:8px}
.cform .q{flex:1;min-width:0;padding-left:14px}
.cform .btn2{min-height:48px}
#bubbles{position:fixed;inset:0;z-index:30;pointer-events:none}
.bubble{position:absolute;max-width:min(72vw,320px);padding:9px 13px;border-radius:16px;background:#fff;color:#2a0f55;font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:translateX(-50%);transition:opacity .25s ease-out;animation:bub .35s cubic-bezier(.2,.9,.3,1.4)}
.bubble::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:2px;background:#fff;transform:rotate(45deg)}
.bubble.out{opacity:0}
@keyframes bub{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.7)}}
#conn{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;padding:8px 16px;border-radius:999px;background:#ff4d6d;color:#fff;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:translateX(-50%)}
@media (min-height:760px){#hud{padding-top:14px}#card{padding:24px 18px 28px}#prev{font-size:clamp(16px,4.6vw,20px);margin:18px 0 14px}#line{font-size:clamp(23px,7.2vw,32px)}#tray{padding-top:24px;gap:14px 10px}.tile{min-height:58px;font-size:clamp(19px,5.7vw,23px)}}
@media (max-height:660px){#hud{padding-top:6px}#card{padding:14px 14px 18px}#prev{margin:12px 0 8px}#tray{padding-top:14px;gap:10px 8px;min-height:130px}.tile{min-height:50px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:1ms!important}.beam{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="hrt" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol></svg>
<div id="app">
  <div class="lights" aria-hidden="true"><div class="beam l"></div><div class="beam r"></div></div>
  <section id="round" data-screen="round">
    <header id="hud">
      <button id="chip" type="button" aria-haspopup="dialog"><span id="chipAv" class="av" aria-hidden="true"></span><span id="chipName"></span><svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span id="qn"></span>
      <span id="hearts" class="hearts" role="img"><i><svg><use href="#hrt"/></svg></i><i><svg><use href="#hrt"/></svg></i><i><svg><use href="#hrt"/></svg></i></span>
      <button id="lbBtn" type="button" aria-haspopup="dialog" data-ta="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h3v3a4 4 0 0 1-3.6 4A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 7.6 12 4 4 0 0 1 4 8V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z"/></svg></button>
      <span id="score" role="status">0</span>
    </header>
    <div id="stripRow" hidden><div id="strip"></div><button class="chatBtn" type="button" data-ta="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.6c-.5.4-1.4.1-1.4-.6V18h0A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4zM7 10a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 7 10zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button></div>
    <main id="stage">
      <div id="card">
        <div id="pop" aria-hidden="true"></div>
        <div class="songRow"><div class="songBox"><div id="song"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span id="songT"></span></div><span id="songSrc" hidden>Apple Music</span></div><button id="muteBtn" type="button" aria-pressed="false" data-ta="mute"><svg class="unmuted" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><svg class="muted" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button></div>
        <p id="prev"></p>
        <p id="line"></p>
      </div>
    </main>
    <div id="tray" role="group"></div>
  </section>
  <section id="end" data-screen="end" hidden>
    <div class="endIn">
      <h2 id="endHead"></h2>
      <div id="endWho"><span id="endAv" class="av" aria-hidden="true"></span><span id="endName"></span></div>
      <div id="endScore">0</div>
      <div id="endMeta"><span id="endHearts" class="hearts" role="img"><i><svg><use href="#hrt"/></svg></i><i><svg><use href="#hrt"/></svg></i><i><svg><use href="#hrt"/></svg></i></span><span id="endLines"></span></div>
      <div id="saveRow" class="save"><span id="saveText" role="status"></span><button id="retry" class="btn2" type="button" data-t="retry" hidden></button></div>
      <button id="again" class="big" type="button" data-t="again"></button>
      <button id="endHall" class="btn2" type="button" data-t="hallBack" hidden></button>
      <div class="board">
        <div class="tabs" role="tablist"><button id="tabF" type="button" role="tab" data-t="friends" aria-selected="true"></button><button id="tabG" type="button" role="tab" data-t="global" aria-selected="false"></button></div>
        <div id="lb"></div>
      </div>
      <h3 id="endNext" data-t="next"></h3>
      <div class="qw"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zm5.5-2l5 5"/></svg><input id="endQ" class="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-tp="search" data-ta="search"></div>
      <div id="endPk" class="pk"></div>
    </div>
  </section>
  <section id="hall" data-screen="hall" hidden>
    <div class="hallIn">
      <button id="hallSinger" class="singer" type="button"><span id="hallAv" class="av" aria-hidden="true"></span><span class="st"><b id="hallSN"></b><small id="hallSS"></small></span><svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="phead"><span data-t="players"></span><b id="hallCount"></b><button id="hallInvite" class="btn2" type="button" data-t="invite" hidden></button><button class="chatBtn" type="button" data-ta="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.6c-.5.4-1.4.1-1.4-.6V18h0A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4zM7 10a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 7 10zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button></div>
      <div id="hallList" class="plist"></div>
      <p id="hallNote" class="note" role="status"></p>
      <button id="readyBtn" class="big ready" type="button"></button>
      <button id="startBtn" class="big gold" type="button" data-t="start" hidden></button>
      <button id="soloBtn" class="link" type="button" data-t="soloPlay"></button>
    </div>
  </section>
  <section id="results" data-screen="results" hidden>
    <div class="endIn">
      <div class="rtop"><div id="resWho"><span id="resAv" class="av" aria-hidden="true"></span><span id="resSinger"></span></div><button class="chatBtn" type="button" data-ta="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.6c-.5.4-1.4.1-1.4-.6V18h0A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4zM7 10a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 7 10zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button></div>
      <svg id="trophy" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M7 3h10v2h3.5a.5.5 0 0 1 .5.5V8a4 4 0 0 1-4.1 4A5 5 0 0 1 13 15.9V18h3a1 1 0 0 1 1 1v2H7v-2a1 1 0 0 1 1-1h3v-2.1A5 5 0 0 1 7.1 12 4 4 0 0 1 3 8V5.5a.5.5 0 0 1 .5-.5H7V3zm10 4v3.4A2 2 0 0 0 19 8V7h-2zM5 7v1a2 2 0 0 0 2 2.4V7H5z"/></svg>
      <h2 id="resHead"></h2>
      <div id="resList" class="plist"></div>
      <div id="resSave" class="save"><span id="resSaveText" role="status"></span><button id="resRetry" class="btn2" type="button" data-t="retry" hidden></button></div>
      <button id="resAgain" class="big" type="button" data-t="again" hidden></button>
    </div>
  </section>
</div>

</div>

    <div class="sh"><b id="boardT" data-t="board"></b><button id="boardX" class="x" type="button" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div id="boardBody"></div>
  </div>
</div>

  <div class="sheet">
    <div class="sh"><b id="pkT" data-t="pick"></b><button id="pkX" class="x" type="button" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div class="qw"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zm5.5-2l5 5"/></svg><input id="pkQ" class="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-tp="search" data-ta="search"></div>
