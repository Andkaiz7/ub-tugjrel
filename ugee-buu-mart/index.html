<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="usion:leaderboard" content="desc">
<meta name="theme-color" content="#070722">
<title>Үгээ бүү март</title>
<style>
:root{--font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bg0:#070722;--bg1:#160b45;--bg2:#2a0e5c;--ink:#faf7ff;--mut:rgba(228,225,255,.74);--dim:rgba(208,204,255,.54);--g1:#fff6c9;--g2:#ffd44d;--g3:#f39a14;--gE:#8c4b03;--gT:#361800;--cyan:#22d3ee;--violet:#8b5cf6;--pink:#ec4899;--heart:#ff4d79;--ok:#34d399;--bad:#fb7185;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.09);--line:rgba(186,174,255,.2);--neon:linear-gradient(135deg,rgba(34,211,238,.78),rgba(139,92,246,.65),rgba(236,72,153,.78));--sheet:linear-gradient(180deg,rgba(34,17,84,.96) 0%,rgba(12,9,42,.98) 100%);color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);font:600 16px/1.25 var(--font)}
body{background:linear-gradient(170deg,var(--bg0) 0%,var(--bg1) 54%,var(--bg2) 100%) var(--bg0)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip}
.lights{position:absolute;inset:0;z-index:0;overflow:hidden;overflow:clip;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(58px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.glow.g-v{top:-14%;left:6%;width:84vw;height:44vh;background:radial-gradient(circle,rgba(139,92,246,.42),rgba(139,92,246,0) 72%)}
.glow.g-c{top:8%;right:-22%;width:72vw;height:40vh;background:radial-gradient(circle,rgba(34,211,238,.28),rgba(34,211,238,0) 72%);animation-delay:-5s}
.glow.g-p{bottom:-12%;left:-18%;width:86vw;height:44vh;background:radial-gradient(circle,rgba(236,72,153,.28),rgba(236,72,153,0) 72%);animation-delay:-10s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12px,-10px,0) scale(1.06)}}
.staff{position:absolute;inset:0;width:100%;height:100%;opacity:.72;pointer-events:none}
section[data-screen]{position:absolute;inset:0;z-index:1;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#round{display:flex;flex-direction:column}
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
#chip{flex:0 1 auto;min-width:0;max-width:46%;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-radius:999px;background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(167,139,250,.28);box-shadow:0 6px 18px rgba(4,4,22,.35),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .12s ease-out}
#chip:active{transform:scale(.96)}
#chip:disabled .caret{display:none}
#chipName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:15px}
#chip .av{width:34px;height:34px;font-size:14px}
.caret{flex:none;width:12px;height:12px;opacity:.78}
#qn{flex:1;min-width:34px;text-align:center;font-weight:800;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.hearts{flex:none;display:flex;gap:2px}
.hearts i{display:block;width:21px;height:21px;color:var(--heart);filter:drop-shadow(0 0 7px rgba(255,77,121,.55));transition:transform .3s ease-out,opacity .3s ease-out}
.hearts svg{width:100%;height:100%}
.hearts i.off{opacity:.24;transform:scale(.78);filter:none;color:#a59cd1}
.hearts i.lose{animation:lose .55s ease-out}
@keyframes lose{0%{transform:scale(1.5)}35%{transform:scale(1.2) rotate(-14deg)}70%{transform:scale(.9) rotate(10deg)}100%{transform:scale(.78)}}
#score{flex:none;min-width:54px;height:36px;padding:0 12px;border-radius:999px;display:grid;place-items:center;background:linear-gradient(180deg,var(--g1),var(--g2) 46%,var(--g3));color:var(--gT);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--gE),0 6px 18px rgba(243,154,20,.32),inset 0 1px 0 rgba(255,255,255,.85)}
#score.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 14px 12px;overflow-y:auto}
#card{position:relative;flex:none;width:100%;max-width:540px;margin:2px 0;padding:18px 16px 24px;border-radius:26px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(167,139,250,.22);box-shadow:0 22px 54px rgba(3,3,20,.52),0 0 42px rgba(139,92,246,.18),0 0 18px rgba(34,211,238,.1),inset 0 1px 0 rgba(255,255,255,.16)}
#card::before,.singer::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:var(--neon);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none}
#card.in{animation:cardIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.songRow{display:grid;grid-template-columns:minmax(40px,1fr) minmax(0,auto) minmax(40px,1fr);align-items:start;gap:4px;min-height:40px}
.songBox{grid-column:2;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:3px}
#song{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:34px;padding:0 11px 0 9px;border-radius:999px;background:rgba(12,10,44,.55);color:var(--g2);font-weight:800;font-size:13.5px;border:1px solid rgba(255,212,77,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#song svg{flex:none;width:14px;height:14px}
#songT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#songSrc{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--mut);white-space:nowrap}
#muteBtn{grid-column:3;justify-self:end;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--glass2);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .1s ease-out,opacity .15s}
#muteBtn:active{transform:scale(.9)}
#muteBtn.off{color:var(--dim);opacity:.72}
#muteBtn svg{width:19px;height:19px}
#skipBtn{grid-column:1;justify-self:start;width:40px;height:40px;padding:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--glass2);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:12.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .1s ease-out,background .15s}
#skipBtn:active{transform:scale(.92)}
#skipBtn svg{width:20px;height:20px}
#lbBtn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--g2);background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(167,139,250,.28);box-shadow:0 6px 16px rgba(4,4,22,.32),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .1s ease-out}
#lbBtn:active{transform:scale(.9)}
#lbBtn svg{width:19px;height:19px}
#boardDlg{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(4,4,20,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease-out}
#boardDlg .sheet{height:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#muteBtn:not(.off) .muted,#muteBtn.off .unmuted{display:none}
#prev{margin:14px 0 10px;color:var(--mut);font-weight:600;font-size:clamp(14.5px,4.2vw,18.5px);line-height:1.38;overflow-wrap:anywhere}
#line{margin:0;color:#ffffff;font-weight:800;font-size:clamp(21px,6.2vw,29px);line-height:1.52;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(4,4,24,.55)}
#line .w{transition:color .3s}
.slot{position:relative;display:inline-block;min-width:2.5em;padding:.02em .24em;border-radius:.36em;line-height:1.2;vertical-align:baseline;color:var(--cyan);text-align:center;background:rgba(139,92,246,.14);border:1.5px dashed rgba(167,139,250,.68)}
.slot.cur{background:rgba(34,211,238,.15);border-color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.32),inset 0 0 10px rgba(34,211,238,.15)}
.slot.cur::after{content:"";position:absolute;inset:-4px;border-radius:.44em;box-shadow:0 0 0 2px rgba(34,211,238,.55),0 0 18px rgba(34,211,238,.55);animation:glow 1.2s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.25}to{opacity:1}}
.slot.on,.slot.miss{min-width:0;padding:0;border:0;background:none;box-shadow:none}
.slot.on{color:var(--g2);text-shadow:0 0 16px rgba(255,212,77,.42);animation:fill .38s cubic-bezier(.2,.9,.3,1.5)}
@keyframes fill{from{transform:scale(1.35) translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.slot.miss{color:#ff9cb0;text-decoration:underline 2.5px rgba(251,113,133,.85);text-underline-offset:.18em;animation:fill .38s ease-out}
#line.win .w,#line.win .slot{color:var(--g1);text-shadow:0 0 20px rgba(255,212,77,.85)}
#line.win{animation:win .5s ease-out}
@keyframes win{40%{transform:scale(1.04)}}
#pop{position:absolute;left:0;right:0;top:-10px;font-weight:900;font-size:34px;color:var(--g2);text-shadow:0 3px 0 var(--gE),0 0 24px rgba(255,212,77,.75);opacity:0;pointer-events:none}
#pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}70%{opacity:1;transform:translateY(-22px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.95)}}
#tray{flex:none;position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:12px 10px;min-height:150px;padding:20px 14px calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-1 * env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,7,34,0),rgba(7,7,34,.58) 32%,rgba(7,7,34,.84))}
#tray::before{content:"";position:absolute;left:8%;right:8%;top:4px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.45),rgba(139,92,246,.45),rgba(236,72,153,.45),transparent)}
.tile{position:relative;min-height:52px;min-width:64px;max-width:100%;padding:10px 18px 9px;border-radius:16px;background:linear-gradient(180deg,#fff6cb 0%,#ffd44d 42%,#f19712 100%);color:var(--gT);font-weight:800;font-size:clamp(18px,5.2vw,22px);line-height:1.15;overflow-wrap:anywhere;box-shadow:0 5px 0 #944f02,0 10px 22px rgba(4,4,22,.48),0 0 16px rgba(255,212,77,.16),inset 0 2px 0 rgba(255,255,255,.88),inset 0 -2px 0 rgba(160,82,0,.22);transition:transform .09s ease-out,opacity .24s ease-out;animation:tileIn .26s cubic-bezier(.2,.9,.3,1.25) backwards}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #944f02,0 4px 10px rgba(4,4,22,.36),inset 0 2px 0 rgba(255,255,255,.85)}
.tile.used{opacity:0;transform:translateY(-22px) scale(.55);pointer-events:none}
.tile.bad{background:linear-gradient(180deg,#ffd6df 0%,#ff6b86 45%,#dc264c 100%);color:#470013;box-shadow:0 5px 0 #841028,0 10px 22px rgba(220,38,76,.35),inset 0 2px 0 rgba(255,255,255,.65);animation:shake .42s ease-in-out}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (hover:hover){.tile:not(.used):hover{transform:translateY(-2px)}}
.av{position:relative;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.35);background:var(--violet);box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -3px 0 rgba(0,0,0,.2)}
.av.pack{border-radius:30%}
img.av{object-fit:cover}
.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}
.av.pack .avimg{border-radius:30%}
#end{overflow-y:auto;overscroll-behavior:contain}
.endIn{max-width:540px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center}
#endHead{margin:4px 0 0;font-weight:900;font-size:28px;color:var(--g1);text-shadow:0 0 24px rgba(255,212,77,.5);animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
#endHead.out{color:#ffb8ca;text-shadow:0 0 24px rgba(236,72,153,.45)}
#endWho{align-self:center;display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 14px 4px 4px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
#endWho .av{width:32px;height:32px;font-size:14px}
#endName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
#endScore{font-weight:900;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--g2);text-shadow:0 4px 0 var(--gE),0 0 40px rgba(255,212,77,.45);animation:cardIn .55s .08s cubic-bezier(.2,.9,.3,1.3) backwards}
#endMeta{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--mut);font-weight:800}
#endMeta .hearts i{width:20px;height:20px}
.save{min-height:24px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--mut)}
.save.saved{color:#6ee7b7}
.save.failed,.save.guest{color:#fda4af}
.btn2{min-height:44px;padding:0 16px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .1s ease-out}
.btn2:active{transform:scale(.95)}
.big{width:100%;min-height:56px;border-radius:18px;background:linear-gradient(180deg,#ff85c4 0%,#ec4899 48%,#be185d 100%);color:#fff;font-weight:900;font-size:20px;letter-spacing:.01em;text-shadow:0 1px 2px rgba(95,0,42,.45);box-shadow:0 5px 0 #7a0d3d,0 12px 28px rgba(236,72,153,.36),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .09s ease-out}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #7a0d3d,0 5px 14px rgba(236,72,153,.28),inset 0 2px 0 rgba(255,255,255,.4)}
.board{padding:10px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 16px 40px rgba(3,3,20,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(5,5,24,.48);border:1px solid rgba(167,139,250,.15)}
.tabs button{min-height:44px;border-radius:11px;font-weight:800;color:var(--mut);transition:transform .1s ease-out,background .15s,color .15s}
.tabs button[aria-selected="true"]{background:rgba(139,92,246,.32);color:#fff;box-shadow:inset 0 0 0 1px rgba(34,211,238,.35),inset 0 1px 0 rgba(255,255,255,.15)}
#lb{display:flex;flex-direction:column;gap:4px;margin-top:8px;min-height:110px;max-height:264px;overflow-y:auto}
.row{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px 6px 8px;border-radius:14px;text-align:left;transition:transform .1s ease-out}
button.row{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04)}
button.row:active{transform:scale(.98)}
.row.me{background:rgba(255,212,77,.12);border:1px solid rgba(255,212,77,.5)}
.row .rk{font-weight:900;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .av{width:36px;height:36px;font-size:15px;background:rgba(139,92,246,.35)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.row .sc{font-weight:900;color:var(--g2);font-variant-numeric:tabular-nums}
.msg{min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--mut);font-size:14px;font-weight:700}
#endNext{margin:10px 2px -2px;text-align:left;font-weight:900;font-size:20px}
.qw{position:relative;flex:none}
.qw svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--dim);pointer-events:none}
.q{width:100%;height:48px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:15px;outline:none;background:rgba(6,6,28,.55);color:#fff;font:600 16px var(--font);-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
.q::placeholder{color:var(--dim)}
.q:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.q::-webkit-search-cancel-button{-webkit-appearance:none}
.pk h4{margin:16px 4px 10px;text-align:left;font-weight:900;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 4px}
.sg{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:6px 2px;border-radius:16px}
.sg .av{width:62px;height:62px;font-size:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -3px 0 rgba(0,0,0,.22),0 8px 18px rgba(3,3,20,.45);transition:transform .12s ease-out}
.sg:active .av{transform:scale(.9)}
.sg.cur .av,.sg.on .av{box-shadow:0 0 0 3px #120b3c,0 0 0 5.5px var(--g2),0 0 22px rgba(255,212,77,.58)}
.sg .ck{display:none;position:absolute;top:2px;right:calc(50% - 33px);width:22px;height:22px;border-radius:50%;place-items:center;background:var(--g2);color:var(--gT);box-shadow:0 0 0 2.5px #120b3c,0 3px 8px rgba(0,0,0,.45);pointer-events:none}
.sg .ck svg{width:13px;height:13px}
.sg.on .ck{display:grid}
.sg .nm.sm{font-size:11px;letter-spacing:-.01em}
.sg .nm{max-width:100%;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink);overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pk .none{padding:28px 0;color:var(--mut);font-weight:700;text-align:center}
#picker{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding-top:calc(48px + env(safe-area-inset-top));background:rgba(4,4,20,.68);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:100%;height:88%;margin:0 auto;display:flex;flex-direction:column;padding:12px 14px 0 calc(14px + env(safe-area-inset-left));border-radius:28px 28px 0 0;background:var(--sheet);border-top:1.5px solid rgba(139,92,246,.55);box-shadow:0 -16px 50px rgba(3,3,20,.68),0 -4px 30px rgba(139,92,246,.2),inset 0 1px 0 rgba(34,211,238,.35);animation:sheetIn .34s cubic-bezier(.2,.85,.2,1)}
@keyframes sheetIn{from{transform:translateY(100%)}}
.sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 12px 4px}
.sh b{font-weight:900;font-size:21px}
.x{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);transition:transform .1s ease-out}
.x:active{transform:scale(.9)}
.x svg{width:18px;height:18px}
.pkSel{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 4px}
.pkSel::-webkit-scrollbar{display:none}
.selc{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;max-width:160px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(255,212,77,.14);border:1.5px solid var(--g2);transition:transform .1s ease-out}
.selc:active{transform:scale(.94)}

.seg{flex:1;max-width:260px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(5,5,24,.48);border:1px solid rgba(167,139,250,.15)}

.singer small{color:var(--g2);font-weight:800;font-size:14px}
.singer .caret{width:16px;height:16px}
.singer:disabled{cursor:default}
.singer:disabled .caret{display:none}
.phead{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--dim);font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.phead b{color:var(--mut);font-variant-numeric:tabular-nums}
.phead .btn2{margin-left:auto;text-transform:none;letter-spacing:0}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px 8px 9px;border-radius:18px;text-align:left;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);animation:cardIn .35s cubic-bezier(.2,.8,.2,1);transition:transform .1s ease-out}
button.pl:active{transform:scale(.98)}
.pl .av{width:44px;height:44px;font-size:17px}
.pl .nm{min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag.dim{background:var(--glass2);color:var(--mut);border-color:var(--line)}
.pl .rd{font-weight:900;font-size:14px;color:var(--dim);white-space:nowrap}
.pl.ok{background:rgba(52,211,153,.11);border-color:rgba(52,211,153,.58)}
.pl.ok .rd{color:#6ee7b7}
.pl.away{opacity:.55}

.big.ready:active{box-shadow:0 1px 0 rgba(6,78,59,.75),0 4px 12px rgba(16,185,129,.15)}

.rtop{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 52px}

.rr .sc b{font-weight:900;font-size:20px;color:var(--g2)}
.rr .sc small{font-weight:800;font-size:12px;color:var(--mut)}
.rr.win{background:rgba(255,212,77,.12);border-color:var(--g2);box-shadow:0 0 28px rgba(255,212,77,.2)}
.rr.gone{opacity:.6}
#chat{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(4,4,20,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease-out}
.csheet{width:100%;max-width:560px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--sheet);border-top:1.5px solid rgba(139,92,246,.55);box-shadow:0 -16px 50px rgba(3,3,20,.68),0 -4px 30px rgba(139,92,246,.2),inset 0 1px 0 rgba(34,211,238,.35);animation:sheetIn .3s cubic-bezier(.2,.85,.2,1)}
#phrases{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph{min-height:44px;padding:0 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);font-weight:800;font-size:15px;transition:transform .1s ease-out}
.ph:active{transform:scale(.95)}
.cform{display:flex;gap:8px}
.cform .q{flex:1;min-width:0;padding-left:14px}
.cform .btn2{min-height:48px}
#bubbles{position:fixed;inset:0;z-index:30;pointer-events:none}
.bubble{position:absolute;max-width:min(72vw,320px);padding:9px 13px;border-radius:16px;background:#faf8ff;color:#160b45;font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere;box-shadow:0 10px 26px rgba(3,3,20,.45),0 0 0 1.5px rgba(34,211,238,.38);transform:translateX(-50%);transition:opacity .25s ease-out;animation:bub .35s cubic-bezier(.2,.9,.3,1.4)}
.bubble::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:2px;background:#faf8ff;transform:rotate(45deg)}
.bubble.out{opacity:0}
@keyframes bub{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.7)}}
#conn{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;padding:8px 16px;border-radius:999px;background:#e11d48;color:#fff;font-weight:800;font-size:14px;box-shadow:0 8px 22px rgba(225,29,72,.45);transform:translateX(-50%)}

    <div class="hallIn">
      <button id="hallSinger" class="singer" type="button"><span id="hallAv" class="av" aria-hidden="true"></span><span class="st"><b id="hallSN"></b><small id="hallSS"></small></span><svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="phead"><span data-t="players"></span><b id="hallCount"></b><button id="hallInvite" class="btn2" type="button" data-t="invite" hidden></button><button class="chatBtn" type="button" data-ta="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.6c-.5.4-1.4.1-1.4-.6V18h0A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4zM7 10a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 7 10zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button></div>
      <div id="hallList" class="plist"></div>
      <p id="hallNote" class="note" role="status"></p>
      <button id="readyBtn" class="big ready" type="button"></button>
      <button id="startBtn" class="big gold" type="button" data-t="start" hidden></button>
      <button id="soloBtn" class="link" type="button" data-t="soloPlay"></button>
    </div>
  </section>
  <section id="results" data-screen="results" hidden>
    <div class="endIn">
      <div class="rtop"><div id="resWho"><span id="resAv" class="av" aria-hidden="true"></span><span id="resSinger"></span></div><button class="chatBtn" type="button" data-ta="chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.6c-.5.4-1.4.1-1.4-.6V18h0A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4zM7 10a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 7 10zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button></div>
      <svg id="trophy" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M7 3h10v2h3.5a.5.5 0 0 1 .5.5V8a4 4 0 0 1-4.1 4A5 5 0 0 1 13 15.9V18h3a1 1 0 0 1 1 1v2H7v-2a1 1 0 0 1 1-1h3v-2.1A5 5 0 0 1 7.1 12 4 4 0 0 1 3 8V5.5a.5.5 0 0 1 .5-.5H7V3zm10 4v3.4A2 2 0 0 0 19 8V7h-2zM5 7v1a2 2 0 0 0 2 2.4V7H5z"/></svg>
      <h2 id="resHead"></h2>
      <div id="resList" class="plist"></div>
      <div id="resSave" class="save"><span id="resSaveText" role="status"></span><button id="resRetry" class="btn2" type="button" data-t="retry" hidden></button></div>
      <button id="resAgain" class="big" type="button" data-t="again" hidden></button>
    </div>
  </section>
</div>
<div id="chat" role="dialog" aria-modal="true" aria-labelledby="chatT" hidden>
  <div class="csheet">
    <div class="sh"><b id="chatT" data-t="chat"></b><button id="chatX" class="x" type="button" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div id="phrases"></div>
    <form id="chatForm" class="cform"><input id="chatIn" class="q" type="text" maxlength="60" autocomplete="off" enterkeyhint="send" data-tp="chatPh" data-ta="chatPh"><button class="btn2" type="submit" data-t="send"></button></form>
  </div>
</div>
<div id="bubbles"></div>
<div id="conn" role="status" hidden><span data-t="reconnecting"></span></div>
<div id="boardDlg" role="dialog" aria-modal="true" aria-labelledby="boardT" hidden>
  <div class="sheet">
    <div class="sh"><b id="boardT" data-t="board"></b><button id="boardX" class="x" type="button" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div id="boardBody"></div>
  </div>
</div>
<div id="picker" role="dialog" aria-modal="true" aria-labelledby="pkT" hidden>
  <div class="sheet">
    <div class="sh"><b id="pkT" data-t="pick"></b><button id="pkX" class="x" type="button" data-ta="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div class="qw"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zm5.5-2l5 5"/></svg><input id="pkQ" class="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-tp="search" data-ta="search"></div>
    <div id="pkSel" class="pkSel" hidden></div>
    <div id="pkList" class="pk"></div>
    <div id="pkFoot">
      <div class="pkRow">
        <span id="pkCountLbl" data-t="count"></span>
        <div id="pkCounts" class="seg" role="radiogroup" aria-labelledby="pkCountLbl">
          <button type="button" role="radio" aria-checked="false" data-n="5">5</button>
          <button type="button" role="radio" aria-checked="true" data-n="10">10</button>
          <button type="button" role="radio" aria-checked="false" data-n="20">20</button>
          <button type="button" role="radio" aria-checked="false" data-n="30">30</button>
        </div>
      </div>
      <button id="pkGo" class="big gold" type="button" disabled></button>
    </div>
  </div>
</div>
<audio id="bgm" loop preload="none" crossorigin="anonymous"></audio>
<script src="lyrics-data.js"></script>
<script src="core.js"></script>
<script src="media-data.js"></script>
<script src="app.js"></script>
<script src="mp.js"></script>
</body>
